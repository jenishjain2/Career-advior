<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resume Upload</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body{
            background: #0f172a;
            color: white;
        }

        .upload-box{
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            margin-top: 100px;
        }

    </style>

    <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
    />

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="upload-box">

                <h1 class="text-center mb-4">

                    Upload Resume

                </h1>

                <form
                    method="POST"
                    enctype="multipart/form-data"
                >

                    <input
                        type="file"
                        name="resume"
                        class="form-control mb-4"
                    >

                    <button
                        class="btn btn-primary w-100"
                    >

                        Analyze Resume

                    </button>

                </form>

                {% if skills %}

                <div class="mt-5">

                    <h4>
                        Extracted Skills
                    </h4>

                    {% for skill in skills %}

                        <span class="badge bg-success m-1">

                            {{ skill }}

                        </span>

                    {% endfor %}

                </div>
                
                <br><br>

                <h4>
                    Resume Feedback
                </h4>

                <ul class="list-group">

                    {% for item in feedback %}

                    <li class="list-group-item bg-dark text-white">

                        {{ item }}

                    </li>

                    {% endfor %}

                </ul>

                {% endif %}

            </div>

        </div>

    </div>

</div>

</body>
</html>
