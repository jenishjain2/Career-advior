<!DOCTYPE html>
<html>

<head>

    <title>Login - AI Career Advisor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
    />

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins', sans-serif;

            background:
            linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #1e293b
            );

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            overflow:hidden;
        }

        .background-circle{

            position:absolute;

            border-radius:50%;

            filter:blur(80px);

            opacity:0.4;
        }

        .circle1{

            width:300px;

            height:300px;

            background:#3b82f6;

            top:-100px;

            left:-100px;
        }

        .circle2{

            width:350px;

            height:350px;

            background:#8b5cf6;

            bottom:-120px;

            right:-120px;
        }

        .login-card{

            width:420px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,0.1);

            padding:45px;

            border-radius:25px;

            box-shadow:0px 10px 30px rgba(0,0,0,0.4);

            z-index:10;

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{

                opacity:0;

                transform:translateY(20px);
            }

            to{

                opacity:1;

                transform:translateY(0px);
            }
        }

        .logo{

            text-align:center;

            margin-bottom:25px;
        }

        .logo i{

            font-size:55px;

            color:#3b82f6;
        }

        .logo h1{

            color:white;

            margin-top:15px;

            font-size:30px;

            font-weight:700;
        }

        .subtitle{

            text-align:center;

            color:#cbd5e1;

            margin-bottom:35px;
        }

        .form-label{

            color:white;

            margin-bottom:8px;
        }

        .form-control{

            background:rgba(255,255,255,0.08);

            border:none;

            color:white;

            padding:14px;

            border-radius:12px;
        }

        .form-control:focus{

            background:rgba(255,255,255,0.1);

            color:white;

            border:1px solid #3b82f6;

            box-shadow:none;
        }

        .form-control::placeholder{

            color:#94a3b8;
        }

        .btn-login{

            width:100%;

            background:#3b82f6;

            border:none;

            padding:14px;

            border-radius:12px;

            font-weight:600;

            margin-top:10px;

            transition:0.3s;
        }

        .btn-login:hover{

            background:#2563eb;

            transform:scale(1.02);
        }

        .bottom-text{

            text-align:center;

            margin-top:25px;

            color:#cbd5e1;
        }

        .bottom-text a{

            color:#60a5fa;

            text-decoration:none;

            font-weight:600;
        }

        .bottom-text a:hover{

            text-decoration:underline;
        }

    </style>

</head>

<body>

<!-- BACKGROUND EFFECTS -->

<div class="background-circle circle1"></div>

<div class="background-circle circle2"></div>

<!-- LOGIN CARD -->

<div class="login-card">

    <div class="logo">

        <i class="fa-solid fa-brain"></i>

        <h1>

            AI Career Advisor

        </h1>

    </div>

    <p class="subtitle">

        Login to continue your AI career journey

    </p>

    <form
        method="POST"
    >

        <!-- USERNAME -->

        <div class="mb-4">

            <label class="form-label">

                Username

            </label>

            <input
                type="text"

                name="username"

                class="form-control"

                placeholder="Enter username"

                required
            >

        </div>

        <!-- PASSWORD -->

        <div class="mb-4">

            <label class="form-label">

                Password

            </label>

            <input
                type="password"

                name="password"

                class="form-control"

                placeholder="Enter password"

                required
            >

        </div>

        <!-- BUTTON -->

        <button
            type="submit"

            class="btn btn-primary btn-login"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>

    </form>

    <!-- REGISTER -->

    <div class="bottom-text">

        Don't have an account?

        <a href="/register">

            Register

        </a>

    </div>

</div>

</body>
</html>
