<!DOCTYPE html>
<html>

<head>

    <title>Skill Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
    />

    <style>

        body{

            background:
            linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #1e293b
            );

            color:white;

            min-height:100vh;

            font-family:'Poppins', sans-serif;
        }

        .tracker-box{

            background:rgba(255,255,255,0.05);

            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.1);

            padding:40px;

            border-radius:25px;

            margin-top:50px;
        }

        .skill-item{

            background:#1e293b;

            padding:15px;

            border-radius:15px;

            margin-bottom:12px;

            display:flex;

            justify-content:space-between;

            align-items:center;
        }

        .progress{

            height:30px;

            border-radius:20px;

            overflow:hidden;
        }

        .progress-bar{

            animation:loadBar 1.5s ease;
        }

        @keyframes loadBar{

            from{

                width:0%;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="tracker-box">

        <h1 class="mb-4">

            Skill Progress Tracker

        </h1>

        <h4>

            Progress:
            {{ progress }}%

        </h4>

        <div class="progress mb-4">

            <div
                class="progress-bar bg-success text-dark fw-bold"

                style="width: {% if progress == 0 %}5{% else %}{{ progress }}{% endif %}%;"
            >

                {{ progress }}%

            </div>

        </div>

        {% for skill in skills %}

        <div class="skill-item">

            <div>

                {% if skill.completed %}

                    ✔

                {% else %}

                    ❌

                {% endif %}

                {{ skill.skill }}

            </div>

            <form
                action="/toggle_skill/{{ skill.id }}"
                method="POST"
            >

                {% if skill.completed %}

                <button class="btn btn-danger">

                    Mark Incomplete

                </button>

                {% else %}

                <button class="btn btn-success">

                    Mark Complete

                </button>

                {% endif %}

            </form>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
