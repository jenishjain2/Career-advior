<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background-color: #0f172a;
            color: white;
        }

        .card-box{
            background-color: #1e293b;
            padding: 30px;
            border-radius: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .number{
            font-size: 40px;
            font-weight: bold;
        }

    </style>

    <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
    />

</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-5">

        Admin Dashboard

    </h1>

    <div class="row">

        <!-- Users -->

        <div class="col-md-4">

            <div class="card-box">

                <h3>Total Users</h3>

                <div class="number">

                    {{ total_users }}

                </div>

            </div>

        </div>

        <!-- Careers -->

        <div class="col-md-4">

            <div class="card-box">

                <h3>Total Careers</h3>

                <div class="number">

                    {{ total_careers }}

                </div>

            </div>

        </div>

        <!-- Skills -->

        <div class="col-md-4">

            <div class="card-box">

                <h3>Total Skills</h3>

                <div class="number">

                    {{ total_skills }}

                </div>

            </div>

        </div>

    </div>

    <!-- Chart -->

    <div class="card-box mt-5">

        <h2 class="mb-4">

            Platform Analytics

        </h2>

        <canvas id="myChart"></canvas>

    </div>

</div>

<script>

const users = Number("{{ total_users }}");
const careers = Number("{{ total_careers }}");
const skills = Number("{{ total_skills }}");

const ctx = document.getElementById("myChart");

new Chart(ctx, {

    type: "bar",

    data: {

        labels: [

            "Users",
            "Careers",
            "Skills"

        ],

        datasets: [{

            label: "Statistics",

            data: [

                users,
                careers,
                skills

            ],

            borderWidth: 1
        }]
    },

    options: {

        responsive: true,

        scales: {

            y: {

                beginAtZero: true

            }
        }
    }
});

</script>

</body>
</html>
