
<!DOCTYPE html>
<html>

<head>

    <title>AI Career Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
    />

    <style>

        body{

            background:
            linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #1e293b
            );

            color:white;

            min-height:100vh;

            font-family:'Poppins', sans-serif;
        }

        .navbar{

            background:#020617;

            box-shadow:0px 0px 20px rgba(0,0,0,0.5);
        }

        .main-box{

            background:rgba(255,255,255,0.05);

            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.1);

            padding:50px;

            border-radius:25px;

            margin-top:50px;

            box-shadow:0px 0px 20px rgba(0,0,0,0.4);
        }

        .main-box:hover{

            transform:translateY(-5px);

            transition:0.3s;
        }

        .title{

            font-size:50px;

            font-weight:700;
        }

        .subtitle{

            color:#cbd5e1;

            font-size:18px;
        }

        .card-box{

            background:rgba(255,255,255,0.05);

            padding:25px;

            border-radius:20px;

            text-align:center;

            margin-bottom:20px;

            transition:0.3s;
        }

        .card-box:hover{

            transform:translateY(-5px);

            box-shadow:0px 10px 25px rgba(59,130,246,0.3);
        }

        .form-control,
        .form-select{

            background:#1e293b;

            border:none;

            color:white;

            padding:15px;

            border-radius:12px;
        }

        .form-control:focus,
        .form-select:focus{

            background:#1e293b;

            color:white;

            border:1px solid #3b82f6;

            box-shadow:none;
        }

        .btn{

            border-radius:12px;

            padding:12px;

            font-weight:600;

            transition:0.3s;
        }

        .btn:hover{

            transform:scale(1.03);
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark px-4">

    <a class="navbar-brand fw-bold">

        AI Career Advisor

    </a>

    <div>

        <a
            href="/tracker"

            class="btn btn-success me-2"
        >

            Skill Tracker

        </a>

        <a
            href="/logout"

            class="btn btn-danger"
        >

            Logout

        </a>

    </div>

</nav>

<div class="container">

    <div class="main-box">

        <h1 class="title text-center">

            Smart AI Career Advisor

        </h1>

        <p class="subtitle text-center mb-5">

            Get AI-powered career recommendations and roadmap guidance.

        </p>

        <!-- STATS -->

        <div class="row mb-5">

            <div class="col-md-4">

                <div class="card-box">

                    <i class="fa-solid fa-brain fa-2x mb-3"></i>

                    <h3>AI Powered</h3>

                    <p>Smart Recommendation Engine</p>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card-box">

                    <i class="fa-solid fa-chart-line fa-2x mb-3"></i>

                    <h3>Career Analytics</h3>

                    <p>Track Skill Growth</p>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card-box">

                    <i class="fa-solid fa-file fa-2x mb-3"></i>

                    <h3>Resume Analysis</h3>

                    <p>Automatic Skill Detection</p>

                </div>

            </div>

        </div>

        <!-- FORM -->

        <form
            action="/dashboard"
            method="POST"
        >

            <label class="mb-2">

                Enter Skills

            </label>

            <input
                type="text"

                name="skills"

                class="form-control mb-4"

                placeholder="python, sql, machine learning"

                required
            >

            <label class="mb-2">

                Select Domain

            </label>

            <select
                name="domain"

                class="form-select mb-4"
            >

                <option>All</option>

                <option>Artificial Intelligence</option>

                <option>Data Science</option>

                <option>Web Development</option>

                <option>Cyber Security</option>

                <option>Cloud Computing</option>

            </select>

            <button
                type="submit"

                class="btn btn-primary w-100"
            >

                Get Career Recommendation

            </button>

        </form>

        <!-- RESUME -->

        <hr class="my-5">

        <h3 class="mb-4">

            Upload Resume

        </h3>

        <form
            action="/upload_resume"

            method="POST"

            enctype="multipart/form-data"
        >

            <input
                type="file"

                name="resume"

                class="form-control mb-4"

                required
            >

            <button
                type="submit"

                class="btn btn-success w-100"
            >

                Upload Resume

            </button>

        </form>

    </div>

</div>

<footer class="text-center mt-5 mb-4">

    <p class="text-secondary">

        AI Career Advisor © 2026

    </p>

</footer>

</body>
</html>
